<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>StudyMate</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:85px}
header{background:#111827;color:white;padding:25px 20px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#cbd5e1}
.card{background:white;margin:16px;border-radius:18px;padding:18px;box-shadow:0 4px 16px #00000010}
.progress{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:#22c55e}
input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin:7px 0}
button{border:0;border-radius:12px;padding:11px 15px;background:#111827;color:white;cursor:pointer}.add{width:100%;margin-top:5px}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.task:last-child{border:0}
.task span{flex:1}.done{text-decoration:line-through;color:#9ca3af}
.delete{background:#ef4444;padding:7px 10px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;gap:10px;padding:12px;z-index:5}
nav button{background:#e5e7eb;color:#111827}.hidden{display:none}.timer{text-align:center;font-size:52px;font-weight:bold;margin:15px}
.small{color:#6b7280;font-size:14px}
</style>
</head>
<body>
<div class="app">
<header><h1>📚 StudyMate</h1><p>Your Class 10 study companion</p></header>

<section id="home">
<div class="card">
<h2>Today's Progress</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="progressText" class="small">0% completed</p>
</div>

<div class="card">
<h2>➕ Add Study Task</h2>
<input id="taskInput" placeholder="e.g. Complete History Chapter 1">
<select id="subject">
<option>Science</option><option>Maths</option><option>SST</option>
<option>English</option><option>Hindi</option><option>IT</option>
</select>
<button class="add" onclick="addTask()">Add Task</button>
</div>

<div class="card">
<h2>✅ Tasks</h2>
<div id="tasks"></div>
</div>
</section>

<section id="timer" class="hidden">
<div class="card">
<h2>⏱️ Study Timer</h2>
<div class="timer" id="clock">25:00</div>
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
<p class="small">Focus for 25 minutes, then take a short break.</p>
</div>
</section>

<section id="notes" class="hidden">
<div class="card">
<h2>📝 Quick Notes</h2>
<textarea id="note" style="width:100%;height:220px;padding:12px;border:1px solid #d1d5db;border-radius:12px" placeholder="Write your notes here..."></textarea>
<br><br><button onclick="saveNote()">Save Note</button>
<p id="saved" class="small"></p>
</div>
</section>

<nav>
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('timer')">⏱️ Timer</button>
<button onclick="show('notes')">📝 Notes</button>
</nav>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]');
let note=localStorage.getItem('note')||'';
document.getElementById('note').value=note;
let seconds=1500, interval=null;

function save(){localStorage.setItem('tasks',JSON.stringify(tasks));render();}
function addTask(){
 const input=document.getElementById('taskInput'), text=input.value.trim();
 if(!text)return;
 tasks.push({text,subject:document.getElementById('subject').value,done:false});
 input.value='';save();
}
function toggle(i){tasks[i].done=!tasks[i].done;save();}
function del(i){tasks.splice(i,1);save();}
function render(){
 const box=document.getElementById('tasks');
 box.innerHTML=tasks.length?tasks.map((t,i)=>`<div class="task">
 <input type="checkbox" style="width:auto;margin:0" ${t.done?'checked':''} onchange="toggle(${i})">
 <span class="${t.done?'done':''}"><b>${escapeHtml(t.text)}</b><br><small>${t.subject}</small></span>
 <button class="delete" onclick="del(${i})">×</button></div>`).join(''):'<p class="small">No tasks yet. Add your first study task!</p>';
 const done=tasks.filter(t=>t.done).length, pct=tasks.length?Math.round(done/tasks.length*100):0;
 document.getElementById('bar').style.width=pct+'%';document.getElementById('progressText').textContent=pct+'% completed';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(id){['home','timer','notes'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
function updateClock(){let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('clock').textContent=m+':'+s;}
function startTimer(){if(interval)return;interval=setInterval(()=>{if(seconds>0){seconds--;updateClock()}else{clearInterval(interval);interval=null;alert('Study session complete! 🎉')}} ,1000);}
function pauseTimer(){clearInterval(interval);interval=null;}
function resetTimer(){pauseTimer();seconds=1500;updateClock();}
function saveNote(){localStorage.setItem('note',document.getElementById('note').value);document.getElementById('saved').textContent='Saved on this device ✓';}
render();updateClock();
</script>
</body>
</html>
